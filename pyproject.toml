[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hgfvision"
version = "0.1.0"
description = "Controlled hierarchical uncertainty experiments with small ResNet adapters"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "torchvision>=0.17", "numpy>=1.24", "Pillow>=9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
hgfvision = "hgfvision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
